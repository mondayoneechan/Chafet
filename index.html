<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>*Chafet!*</title>
<style>
    body {
        background: linear-gradient(135deg, #F4A7C5, #C8A9E8, #A8B8F0);
        min-height: 100vh;
        background-repeat: no-repeat;
        color: #493D62;
        font-family: sans-serif;;
        text-align: center;
    } h1{font-size: 38px;}
</style>
</head>
<body>
    <h1>Pick your character's fate!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!</h1>
    <input id="charnem" placeholder="Charnem (not all would work!)">
    <button id="fateBtn">Confirm?</button>
    <p id="result">Waiting for your character!</p>
    <script>

let fates = [
    'Boutta have a cake!!!', 'Tripped','Plate No Broke','doomscrolled... it was so fun!','ate some cookies, they were so sweet!','Went to Saudi and stayed there for eternity', 'sobbed']




        let fateBtn = document.getElementById('fateBtn');
        let result = document.getElementById('result');
        let charnem = document.getElementById('charnem');


        fateBtn.addEventListener("click", function() {
            let name = charnem.value;

            if(name === ""){
result.textContent = "yo forgot da character!!";
            } else { let randomFate = Math.floor(Math.random() * fates.length);
                result.textContent = name + ": " + fates[randomFate];
            }
        })
    </script>
</body>
</html>
